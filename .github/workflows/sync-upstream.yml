name: Sync with Upstream

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge upstream/main --no-edit -m "chore(sync): merge upstream/main into main"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git push origin main
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Notify on conflict
        if: steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Upstream sync conflict detected",
              body: "The automated sync workflow encountered merge conflicts when merging `upstream/main` into `main`.\n\nPlease pull latest upstream locally and resolve conflicts:\n```bash\n./scripts/sync-upstream.sh\n```"
            });
